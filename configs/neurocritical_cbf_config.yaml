# ============================================================================
# Q-DIAPEDESIS: Neurocritical-Care Control Barrier Functions (CBF) Config
# ============================================================================

cbf_safety_thresholds:
  max_wall_shear_stress_Pa: 5.50            # Anti-NETosis & Glycocalyx shedding ceiling
  shear_enforcement_mode: "total_wall_shear"
  min_glycocalyx_integrity_ratio: 0.92      # Preserve >= 92% baseline thickness
  max_brain_temp_elevation_C: 0.30          # Magnetothermal safety limit (Delta T < 0.3 C)
  max_distal_emboli_escape_ratio: 0.01

staged_cpp_recanalization:
  enable_staged_stepping: true
  num_recanalization_stages: 4
  max_pressure_surge_mmHg_per_sec: 2.50
  pulsed_pH_buffering_duty_cycle: 0.40
  min_safe_efflux_pH: 7.15

cbf_qp_solver:
  barrier_class_kappa_shear: 5.0
  barrier_class_kappa_thermal: 3.5
  barrier_class_kappa_cpp: 4.0
  control_relaxation_penalty: 100.0

post_task_retrieval:
  enable_degaussing_pulse: true
  degaussing_decay_tau_ms: 250.0
  retrograde_wall_velocity_um_s: 45.0
  target_retrieval_efficiency_min: 0.99

# ----------------------------------------------------------------------------
# Model implementation constants (not preregistered hypothesis thresholds).
# Added 2026-10-24 under decisions D3/D5; rationale logged in ELN #003.
# ----------------------------------------------------------------------------
implementation_constants:
  shear_dose_response:
    hill_tau50_Pa: 8.0              # highest shear dose tested by Baratchi et al. 2024 (80 dyn/cm^2), assumed half-maximal
    hill_n: 6                       # a-priori criterion: Hill fraction <= 1.5% at 3.9 Pa physiological shear (Rovainen 1993)
    glyco_k_mech_max_inv_s: 0.356   # equals the pre-D3 stripping rate at 8 Pa (0.045*(8-5.5)^1.5) at half-maximum
    glyco_k_oscillatory_inv_s: 0.0015
    glyco_k_enzymatic_acid_inv_s: 0.008
    netosis_k_max_inv_s: 0.0496     # equals the pre-D3 NETosis rate at 8 Pa (0.12*((8-5.5)/5.5)^2) at half-maximum
    netosis_clearance_inv_s: 0.01
  cbf_coupling:
    # H3 (ELN #002/#003): couplings previously hard-coded in cbf_safety_filter.py. Values
    # unchanged under D5; they are model couplings, not preregistered hypothesis thresholds.
    robot_shear_Pa_per_mT_Hz: 0.0042      # tau_robot = k * B[mT] * f[Hz]; not derived from a cited measurement
    cpp_surge_mmHg_per_recanal_rate: 18.0 # surge = k * recanalization rate [1/s]; not derived from a cited measurement
    thermal_cooling_rate_inv_s: 0.08      # barrier cooling term in the thermal ZCBF
  bioheat:
    # UNIT CORRECTION (ELN #003): the coefficient below was named q_mag_mW_cm3 and commented as a
    # power density, but it is added directly to dT/dt, so it is a specific heating RATE in
    # degC/(s*Hz*mT^2). Value unchanged. NOTE: this is NOT a Pennes bioheat solution - there is no
    # tissue density, specific heat, conductivity or SAR conversion anywhere in the model.
    heating_rate_degC_per_s_per_Hz_mT2: 1.8e-6
    perfusion_cooling_base_inv_s: 0.08
    perfusion_velocity_scale_um_s: 1000.0
  post_task_retrieval_model:
    # Retrieval accounting constants previously hard-coded in pino_observer_retrieval.py (D5).
    branch_recapture_efficiency_max: 0.82
    mainstem_plugging_loss_floor_pct: 0.25
    mainstem_plugging_loss_per_cohesion_pct: 14.5
    default_degaussing_duration_ms: 1200.0
