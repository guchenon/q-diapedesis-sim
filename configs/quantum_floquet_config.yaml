# ============================================================================
# Q-DIAPEDESIS: Bimodal Floquet-Lindblad Swarm & Sub-Voxel Observer Config
# ============================================================================

swarm_scaling:
  execution_mode: "path_b_super_particles"  # Options: "path_a_full_gpu", "path_b_super_particles"
  n_super_particles: 200
  n_full_swarm_equivalent: 10000
  sub_swarm_alpha_ratio: 0.60               # Proximal thrombolytic drilling group
  sub_swarm_beta_ratio: 0.40                # Distal embolic trapping mesh group

bimodal_floquet_drive:
  global_b_field_static_mT: 15.0
  alpha_drill_frequency_Hz: 80.0
  alpha_drive_amplitude_mT: 8.5
  beta_trap_frequency_Hz: 5.0
  beta_drive_amplitude_mT: 6.0
  floquet_truncation_order: 2
  target_dual_task_fidelity_min: 0.92

lindblad_and_tensor_network:
  viscous_dissipation_gamma: 0.15
  dipole_interaction_strength_J0: 1.25
  ttn_max_bond_dimension_chi: 16
  permutation_equivariant_symmetry: true

mri_sub_voxel_observer:
  mri_blind_window_ms: 100.0
  pino_update_interval_ms: 2.0
  tomography_measurement_shots: 512
